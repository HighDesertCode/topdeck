[project]
name = "topdeck"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "adbc-driver-postgresql>=1.12.0",
    "azure-identity==1.25.3",
    "azure-keyvault-secrets==4.11.2",
    "dbt-core>=1.12.3",
    "dbt-postgres>=1.11.0",
    "polars==1.44.1",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "responses==0.26.3",
]

[tool.pytest.ini_options]
testpaths = ["data/tests"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data/tcgdex", "data/common"]

[project.scripts]
series-pipeline = "tcgdex.series:main"
sets-pipeline = "tcgdex.sets:main"
cards-pipeline = "tcgdex.cards:main"
dbt-build = "common.dbt_runner:main"
