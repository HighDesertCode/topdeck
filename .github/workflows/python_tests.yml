name: Python Tests

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'data/**'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest -v
